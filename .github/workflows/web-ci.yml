name: Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  # GitHub Pages project sites are served from /<repo-name>/, not /.
  # Read by vite.config.js (via process.env.PAGES_BASE) to set Vite's
  # `base`, the PWA manifest's start_url/scope, and the service worker's
  # navigateFallback so they all resolve under this subpath.
  PAGES_BASE: /Bana-Pele/

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let in-flight ones finish
# rather than cancelling a live deploy mid-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-web:
    name: Build PWA bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # Vite bakes VITE_* vars in at build time, not read at runtime.
          # Adding a secret in GitHub's UI does NOT make it available to this
          # step automatically — it must be explicitly listed here too, or
          # `npm run build` never sees it.
          #
          # VITE_API_BASE_URL points Elevate Mentoring calls at the Render
          # proxy (see render-proxy/) instead of Elevate directly, which
          # fails with "Tenant domain not found" from a static host (Elevate
          # requires an Origin header browsers never let JS set). Without
          # this secret set, src/config/env.js falls back to the
          # elevate-proxy Supabase Edge Function instead, which Elevate's WAF
          # blocks — so this one specifically has to be set for login to work
          # in production.
          #
          # All four need real values — add them as repo secrets:
          # Settings → Secrets and variables → Actions → New repository
          # secret (same values as your local .env.local for the Supabase
          # ones; VITE_API_BASE_URL is the Render proxy's URL).
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ADMIN_REVIEW_PASSWORD: ${{ secrets.VITE_ADMIN_REVIEW_PASSWORD }}
          # Powers the Registration Guide's AI journey feature (see
          # src/services/journeyService.js) -- points at demo-bap-server.js
          # from the separate skillpath-backend repo. Same gotcha as the
          # other VITE_* vars above: must be listed here explicitly, or
          # this build never sees the secret even once it's added in
          # GitHub's UI.
          VITE_DEMO_BAP_BASE_URL: ${{ secrets.VITE_DEMO_BAP_BASE_URL }}

      # GitHub Pages has no server-side rewrite for client-side routes — a
      # direct visit or refresh on e.g. /Bana-Pele/peer-connect would 404
      # without this. GitHub Pages auto-serves 404.html for any unmatched
      # path, so a copy of index.html here lets the SPA router take over
      # once the shell loads. This is unrelated to offline.html (the PWA's
      # own "you're offline" page) — leave that one alone.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-artifact@v4
        with:
          name: bana-pele-web
          path: dist
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-web:
    name: Deploy web PWA to GitHub Pages
    needs: build-web
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
