name: Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  # GitHub Pages project sites are served from /<repo-name>/, not /.
  # Read by vite.config.js (via process.env.PAGES_BASE) to set Vite's
  # `base`, the PWA manifest's start_url/scope, and the service worker's
  # navigateFallback so they all resolve under this subpath.
  PAGES_BASE: /Bana-Pele/

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let in-flight ones finish
# rather than cancelling a live deploy mid-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-web:
    name: Build PWA bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # Vite bakes VITE_* vars in at build time, not read at runtime —
          # unset, these fall back to relative/dev-only defaults (see
          # src/config/env.js) that only resolve correctly behind the Vite
          # dev server's proxy. A static GitHub Pages build has no proxy, so
          # the real absolute API host must be supplied here instead.
          VITE_API_BASE_URL: https://elevate-apis.shikshalokam.org
          # Community Voices' Supabase calls need these too — add the real
          # values (same ones in your local .env.local) as repo secrets:
          # Settings → Secrets and variables → Actions → New repository secret.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # GitHub Pages has no server-side rewrite for client-side routes — a
      # direct visit or refresh on e.g. /Bana-Pele/peer-connect would 404
      # without this. GitHub Pages auto-serves 404.html for any unmatched
      # path, so a copy of index.html here lets the SPA router take over
      # once the shell loads. This is unrelated to offline.html (the PWA's
      # own "you're offline" page) — leave that one alone.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-artifact@v4
        with:
          name: bana-pele-web
          path: dist
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-web:
    name: Deploy web PWA to GitHub Pages
    needs: build-web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
